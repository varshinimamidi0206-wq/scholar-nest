kind = "web"
previewPath = "/"
title = "ScholarNest"
description = "A scholarship discovery and application companion for students across India. Create a student profile, discover transparent eligibility matches, prepare documents, and track applications."
version = "1.0.0"
id = "artifacts/scholarnest"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25220

[services.development]
run = "pnpm --filter @workspace/scholarnest run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/scholarnest", "run", "build" ]
serve = "static"
publicDir = "artifacts/scholarnest/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25220"
BASE_PATH = "/"
